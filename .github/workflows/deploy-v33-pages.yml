
name: Deploy Shubh Nimantran v33 Final to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and Verify Part Files Integrity
        run: |
          echo "=== 1. Checking 8 Binary Part Files Size & Checksums ==="
          python3 -c "
          import hashlib, os, sys

          expected = [
              ('shubh-v33-part1.bin', 22020096, 'fa4c3d35425bb18c0662f0592e82256d28fcdc60746a5efe0260cb327f4287e2'),
              ('shubh-v33-part2.bin', 22020096, '08baf4134ad890bb3a3ff513d8136952f1592310db8250cbfa6ad2832e40ac3b'),
              ('shubh-v33-part3.bin', 22020096, '0a4607a3def7d650082195e65d278dad63539b4cf1e5bbaba8e164190218298f'),
              ('shubh-v33-part4.bin', 22020096, '6d645f5c9c6a8d2ad75bb1094aee470348fd7ccbd6a03773ddbe52fa8ab9c8c5'),
              ('shubh-v33-part5.bin', 22020096, '43daffef04264158864a77a4d0f89811ad332d9f278c31bfeb9b84cf9b4b57ea'),
              ('shubh-v33-part6.bin', 22020096, '3a601a3bc902ad10f0362cb7368785ae6a0e1162963739cb0bf5152f049f34a3'),
              ('shubh-v33-part7.bin', 22020096, 'df72a890c6eaa218365131bb832cce37af39ce706463db7ba0013befe09f058e'),
              ('shubh-v33-part8.bin', 13433162, 'd119ac0085212219674d9ff2f383f6ef39dcd9d76406ac68d4cdea034c9a3c48')
          ]

          has_error = False
          for fname, exp_size, exp_sha in expected:
              if not os.path.exists(fname):
                  print(f'ERROR: File {fname} is missing from repository root!')
                  has_error = True
                  continue

              actual_size = os.path.getsize(fname)
              with open(fname, 'rb') as f:
                  actual_sha = hashlib.sha256(f.read()).hexdigest()

              if actual_size != exp_size:
                  print(f'ERROR: {fname} size mismatch! Expected: {exp_size} bytes, Found: {actual_size} bytes')
                  if actual_size < 100000:
                      with open(fname, 'rb') as f:
                          preview = f.read(200)
                      print(f'  -> Possible HTML/Text file instead of binary: {preview}')
                  has_error = True
              elif actual_sha != exp_sha:
                  print(f'ERROR: {fname} SHA-256 mismatch!\n  Expected: {exp_sha}\n  Found:    {actual_sha}')
                  has_error = True
              else:
                  print(f'✓ {fname} VERIFIED: {actual_size} bytes (SHA-256 match)')

          if has_error:
              print('\n[VALIDATION FAILED] One or more part files are corrupted, truncated, or incomplete.')
              print('Please ensure all 8 binary files are fully downloaded and committed.')
              sys.exit(1)
          else:
              print('\n[VALIDATION PASSED] All 8 binary parts are 100% genuine and intact.')
          "

      - name: Reconstruct Clean Source ZIP
        run: |
          echo "Joining 8 split binary parts..."
          cat shubh-v33-part1.bin shubh-v33-part2.bin shubh-v33-part3.bin shubh-v33-part4.bin shubh-v33-part5.bin shubh-v33-part6.bin shubh-v33-part7.bin shubh-v33-part8.bin > shubh-nimantran-v33-final-clean-source.zip

          echo "Verifying Reconstructed ZIP Integrity & Listing..."
          python3 -c "
          import zipfile, hashlib, os, sys

          exp_zip_size = 167573834
          exp_zip_sha = '9b4f5beaa421a4c53e195e993b57476802ef8fd1cda081d9e4ed0348a0ab76a8'

          actual_size = os.path.getsize('shubh-nimantran-v33-final-clean-source.zip')
          with open('shubh-nimantran-v33-final-clean-source.zip', 'rb') as f:
              actual_sha = hashlib.sha256(f.read()).hexdigest()

          print(f'Reconstructed ZIP Size: {actual_size} bytes')
          print(f'Reconstructed ZIP SHA:  {actual_sha}')

          assert actual_size == exp_zip_size, f'Reconstructed ZIP size mismatch: {actual_size} vs {exp_zip_size}'
          assert actual_sha == exp_zip_sha, f'Reconstructed ZIP SHA mismatch: {actual_sha} vs {exp_zip_sha}'

          zf = zipfile.ZipFile('shubh-nimantran-v33-final-clean-source.zip')
          bad = zf.testzip()
          assert bad is None, f'ZIP corrupted at {bad}'
          print(f'✓ ZIP integrity check PASSED ({len(zf.namelist())} files verified).')
          "

      - name: Extract Clean Source Code
        run: |
          mkdir -p extracted_source
          unzip -q shubh-nimantran-v33-final-clean-source.zip -d extracted_source
          echo "Source code successfully extracted."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extracted_source/package-lock.json

      - name: Install Dependencies & Build Frontend
        working-directory: ./extracted_source
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Verify Build Output
        run: |
          if [ -f "extracted_source/dist/index.html" ]; then
            echo "Build verified: extracted_source/dist/index.html exists."
          else
            echo "Error: index.html not found in dist!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './extracted_source/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
