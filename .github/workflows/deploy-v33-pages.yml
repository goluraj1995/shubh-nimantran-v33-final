
name: Deploy Shubh Nimantran v33 FINAL to GitHub Pages (Candidate Phase 8.89)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Verify 6 BIN Parts, Reconstruct Source Archive & Extract
        run: |
          set -e
          echo "=== Step 1: Verifying 6 BIN Parts ==="
          
          declare -A EXPECTED_SIZES=(
            ["parts/shubh-v33-final-2026-11-09-part1.bin"]=15000000
            ["parts/shubh-v33-final-2026-11-09-part2.bin"]=15000000
            ["parts/shubh-v33-final-2026-11-09-part3.bin"]=15000000
            ["parts/shubh-v33-final-2026-11-09-part4.bin"]=15000000
            ["parts/shubh-v33-final-2026-11-09-part5.bin"]=15000000
            ["parts/shubh-v33-final-2026-11-09-part6.bin"]=9457822
          )

          declare -A EXPECTED_SHAS=(
            ["parts/shubh-v33-final-2026-11-09-part1.bin"]="96f10dc375acdd4ef59cc49c725d74609f486dab5a2512813708e1b88c9a3859"
            ["parts/shubh-v33-final-2026-11-09-part2.bin"]="5fd1189b2dfb301ad3fd6ad9ef5a646d8d1b920532b56c4e3ae42692c66aa9b1"
            ["parts/shubh-v33-final-2026-11-09-part3.bin"]="3c220f62b793512aeb2365bf543a7959190bdf37be9cd0e0b2578f2c89504b2a"
            ["parts/shubh-v33-final-2026-11-09-part4.bin"]="37697494df9c1278a1222e4ee9c256ac9de041cf612d7f262dcac89a2a32f0be"
            ["parts/shubh-v33-final-2026-11-09-part5.bin"]="b0264ef95922101bab5e496c862100b3ad63f4d119feae942e7c5f66a5bdd019"
            ["parts/shubh-v33-final-2026-11-09-part6.bin"]="08093cae4f91605a1cdc3e2a6850d5810bff172260d0a750b2b567028f703e23"
          )

          PARTS=(
            "parts/shubh-v33-final-2026-11-09-part1.bin"
            "parts/shubh-v33-final-2026-11-09-part2.bin"
            "parts/shubh-v33-final-2026-11-09-part3.bin"
            "parts/shubh-v33-final-2026-11-09-part4.bin"
            "parts/shubh-v33-final-2026-11-09-part5.bin"
            "parts/shubh-v33-final-2026-11-09-part6.bin"
          )

          for part in "${PARTS[@]}"; do
            if [ ! -f "$part" ]; then
              echo "ERROR: Missing BIN part: $part"
              exit 1
            fi
            
            ACTUAL_SIZE=$(stat -c%s "$part")
            EXP_SIZE="${EXPECTED_SIZES[$part]}"
            if [ "$ACTUAL_SIZE" -ne "$EXP_SIZE" ]; then
              echo "ERROR: Size mismatch for $part. Expected $EXP_SIZE, got $ACTUAL_SIZE"
              exit 1
            fi

            ACTUAL_SHA=$(sha256sum "$part" | awk '{print $1}')
            EXP_SHA="${EXPECTED_SHAS[$part]}"
            if [ "$ACTUAL_SHA" != "$EXP_SHA" ]; then
              echo "ERROR: SHA-256 mismatch for $part. Expected $EXP_SHA, got $ACTUAL_SHA"
              exit 1
            fi
            echo "VERIFIED PART: $part (Size: $ACTUAL_SIZE bytes, SHA-256: $ACTUAL_SHA)"
          done

          echo "=== Step 2: Reconstructing ZIP Archive ==="
          cat "${PARTS[@]}" > shubh-nimantran-v33-final-clean-source.zip

          echo "=== Step 3: Verifying Reconstructed ZIP Archive & Integrity ==="
          ZIP_SIZE=$(stat -c%s "shubh-nimantran-v33-final-clean-source.zip")
          EXP_ZIP_SIZE=84457822
          if [ "$ZIP_SIZE" -ne "$EXP_ZIP_SIZE" ]; then
            echo "ERROR: ZIP Size mismatch. Expected $EXP_ZIP_SIZE, got $ZIP_SIZE"
            exit 1
          fi

          ZIP_SHA=$(sha256sum "shubh-nimantran-v33-final-clean-source.zip" | awk '{print $1}')
          EXP_ZIP_SHA="9a17896702d88da9e540bb2037cfc1c485c051b047a4696c3dd2831119636db3"
          if [ "$ZIP_SHA" != "$EXP_ZIP_SHA" ]; then
            echo "ERROR: ZIP SHA-256 mismatch. Expected $EXP_ZIP_SHA, got $ZIP_SHA"
            exit 1
          fi
          echo "VERIFIED ZIP: Size $ZIP_SIZE bytes, SHA-256 $ZIP_SHA"

          echo "=== Step 4: ZIP Integrity Test (unzip -t) ==="
          unzip -t shubh-nimantran-v33-final-clean-source.zip

          echo "=== Step 5: Extracting Source Archive ==="
          mkdir -p extracted_source
          unzip -q shubh-nimantran-v33-final-clean-source.zip -d extracted_source/
          echo "Extracted clean source files to extracted_source/"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies & Build Production Dist
        working-directory: extracted_source
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './extracted_source/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
